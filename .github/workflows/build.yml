name: Build package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Pack build artifact
        run: |
          mkdir -p artifacts
          bun pm pack --destination artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-tps-meter-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Attach package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.tgz --clobber --repo "${{ github.repository }}"

